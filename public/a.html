<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Rotato</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Mono', monospace;
            background: #fff;
            color: #000;
            padding: 2rem;
            font-size: 14px;
        }
        h1 { margin-bottom: 1rem; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 2px; }
        .login-form { max-width: 300px; margin-bottom: 2rem; }
        input {
            font-family: inherit;
            font-size: 14px;
            padding: 0.5rem;
            border: 2px solid #000;
            width: 100%;
            margin-bottom: 0.5rem;
        }
        button {
            font-family: inherit;
            font-size: 14px;
            padding: 0.5rem 1rem;
            background: #000;
            color: #fff;
            border: 2px solid #000;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #333; }
        .error { color: red; margin-top: 0.5rem; font-size: 12px; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 2px solid #000; padding: 0.5rem; text-align: left; }
        th { background: #000; color: #fff; text-transform: uppercase; font-size: 11px; }
        td { font-size: 12px; }
        .success { color: green; }
        .fail { color: red; }
        .paused { opacity: 0.5; }
        a { color: #000; }
        .stat { font-size: 11px; color: #666; margin-bottom: 1rem; text-transform: uppercase; }
        .send-stats {
            margin-top: 2rem;
            padding: 1rem;
            border: 2px solid #000;
            background: #f5f5f5;
        }
        .send-stats h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }
        .send-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }
        .stat-box {
            text-align: center;
        }
        .stat-box .value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .stat-box .label {
            font-size: 10px;
            text-transform: uppercase;
            color: #666;
        }
        .stat-box.quota .value {
            color: #0066cc;
        }
        .history-section {
            margin-top: 1.5rem;
            border-top: 1px solid #ccc;
            padding-top: 1rem;
        }
        .history-section h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 11px;
            cursor: pointer;
        }
        .history-item:hover {
            background: #fafafa;
        }
        .history-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-main {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .history-club {
            background: #eee;
            padding: 0.125rem 0.375rem;
            font-size: 9px;
            text-transform: uppercase;
        }
        .history-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .history-date {
            color: #666;
        }
        .history-status {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
        }
        .history-status.status-success { color: green; }
        .history-status.status-failed { color: red; }
        .history-details {
            display: none;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #eee;
            font-size: 10px;
        }
        .history-item.expanded .history-details {
            display: block;
        }
        .history-detail-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .history-detail-label {
            font-weight: 700;
            color: #666;
            min-width: 60px;
        }
        .history-detail-error {
            color: red;
        }
        .history-message {
            background: #f5f5f5;
            padding: 0.5rem;
            margin-top: 0.25rem;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <h1>Rotato Admin</h1>

    <div id="loginSection" class="login-form">
        <input type="tel" id="phone" placeholder="Phone">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="error" class="error"></div>
    </div>

    <div id="dashboard" style="display: none;">
        <div id="stats" class="stat"></div>
        <table>
            <thead>
                <tr>
                    <th>Club</th>
                    <th>Members</th>
                    <th>Last Send</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="clubsTable"></tbody>
        </table>

        <div class="send-stats">
            <h2>Send Stats (All Clubs)</h2>
            <div class="send-stats-grid">
                <div class="stat-box">
                    <div class="value" id="totalSends">—</div>
                    <div class="label">Total Sends</div>
                </div>
                <div class="stat-box">
                    <div class="value success" id="successfulSends">—</div>
                    <div class="label">Successful</div>
                </div>
                <div class="stat-box">
                    <div class="value fail" id="failedSends">—</div>
                    <div class="label">Failed</div>
                </div>
                <div class="stat-box quota">
                    <div class="value" id="quotaRemaining">—</div>
                    <div class="label">Texts Remaining</div>
                </div>
            </div>
            <div class="history-section">
                <h3>Send Log</h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        let credentials = {};

        async function login() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/.netlify/functions/admin-get-clubs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });

                if (response.ok) {
                    credentials = { phone, password };
                    const data = await response.json();
                    console.log('API response:', data);
                    showDashboard(data);
                } else {
                    document.getElementById('error').textContent = 'Invalid credentials';
                }
            } catch (err) {
                document.getElementById('error').textContent = 'Login failed';
            }
        }

        function showDashboard(data) {
            console.log('showDashboard data:', data);
            const clubs = data.clubs || data;
            console.log('clubs array:', clubs);
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            const totalMembers = clubs.reduce((sum, c) => sum + c.memberCount, 0);
            let stats = `v${data.version || '?'} | ${clubs.length} clubs / ${totalMembers} members`;
            if (data.totalInList) stats += ` (${data.totalInList} in list)`;
            if (data.errors && data.errors.length > 0) {
                stats += ` | ERRORS: ${JSON.stringify(data.errors)}`;
            }
            document.getElementById('stats').textContent = stats;

            const tbody = document.getElementById('clubsTable');
            tbody.innerHTML = clubs.map(club => {
                const lastSend = club.lastSend
                    ? `${club.lastSend.to}<br><span style="color:#666">${new Date(club.lastSend.date).toLocaleDateString()}</span>`
                    : '—';
                const status = club.paused ? '<span class="fail">PAUSED</span>' : '<span class="success">ACTIVE</span>';
                return `
                    <tr class="${club.paused ? 'paused' : ''}">
                        <td><a href="/${club.slug}/dashboard" target="_blank">${club.name}</a><br><span style="color:#666">/${club.slug}</span></td>
                        <td>${club.memberCount}</td>
                        <td>${lastSend}</td>
                        <td>${status}</td>
                    </tr>
                `;
            }).join('');

            // Display send stats
            if (data.sendStats) {
                document.getElementById('totalSends').textContent = data.sendStats.totalSends || 0;
                document.getElementById('successfulSends').textContent = data.sendStats.successfulSends || 0;
                document.getElementById('failedSends').textContent = data.sendStats.failedSends || 0;
                document.getElementById('quotaRemaining').textContent = data.sendStats.quotaRemaining !== null ? data.sendStats.quotaRemaining : '—';

                // Render history list
                renderHistory(data.sendStats.history || []);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function renderHistory(history) {
            const historyList = document.getElementById('historyList');
            if (!history || history.length === 0) {
                historyList.innerHTML = '<div style="color:#666;font-size:11px;">No send history</div>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => {
                const status = item.status || (item.success ? 'success' : 'failed');
                return `
                    <div class="history-item" onclick="toggleHistory(${index})" id="history-${index}">
                        <div class="history-summary">
                            <div class="history-main">
                                <span class="history-club">${escapeHtml(item.clubSlug)}</span>
                                <span>${escapeHtml(item.name)}</span>
                            </div>
                            <div class="history-meta">
                                <span class="history-date">${formatDate(item.date)}</span>
                                <span class="history-status status-${status}">${status}</span>
                            </div>
                        </div>
                        <div class="history-details">
                            <div class="history-detail-row">
                                <span class="history-detail-label">Phone:</span>
                                <span>${escapeHtml(item.phone)}</span>
                            </div>
                            <div class="history-detail-row">
                                <span class="history-detail-label">Attempts:</span>
                                <span>${item.attempts || 1}</span>
                            </div>
                            ${item.error ? `
                            <div class="history-detail-row history-detail-error">
                                <span class="history-detail-label">Error:</span>
                                <span>${escapeHtml(item.error)}</span>
                            </div>
                            ` : ''}
                            ${item.quotaRemaining !== undefined ? `
                            <div class="history-detail-row">
                                <span class="history-detail-label">Quota:</span>
                                <span>${item.quotaRemaining} remaining</span>
                            </div>
                            ` : ''}
                            <div class="history-detail-row">
                                <span class="history-detail-label">Message:</span>
                            </div>
                            <div class="history-message">${escapeHtml(item.message)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleHistory(index) {
            const item = document.getElementById(`history-${index}`);
            item.classList.toggle('expanded');
        }

        // Auto-login if credentials in sessionStorage
        const saved = sessionStorage.getItem('rotato-admin');
        if (saved) {
            const { phone, password } = JSON.parse(saved);
            document.getElementById('phone').value = phone;
            document.getElementById('password').value = password;
        }

        // Save on successful login
        const origLogin = login;
        login = async function() {
            await origLogin();
            if (credentials.phone) {
                sessionStorage.setItem('rotato-admin', JSON.stringify(credentials));
            }
        };
    </script>
</body>
</html>
